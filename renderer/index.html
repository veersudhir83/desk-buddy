<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
  <title>Desk Buddy</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
      user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #bubble { position: fixed; display: none; max-width: 320px; box-sizing: border-box;
      padding: 12px 14px; background: #fff; color: #1f2430; border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,.28); font-size: 15px; line-height: 1.35; }
    #bubble::after { content: ""; position: absolute; bottom: -9px; left: var(--tail, 30px);
      border: 9px solid transparent; border-bottom: 0; border-top-color: #fff; }
    #bubble .row { display: flex; gap: 8px; margin-top: 10px; }
    #bubble button { font: inherit; font-size: 13px; padding: 6px 12px; border: 0;
      border-radius: 8px; cursor: pointer; background: #3b6cf6; color: #fff; }
    #bubble button.alt { background: #e8ebf3; color: #1f2430; }
    #bubble button:hover { filter: brightness(.95); }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble">
    <div id="msg"></div>
    <div class="row">
      <button id="done">Done</button>
      <button id="snooze" class="alt">Snooze 10 min</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
